!=============================================================================== !
! PyHOPE CONFIGURATION FILE - TEMPLATE
! Case: Gmsh to PyHOPE (Order 4)
!=============================================================================== !

!=============================================================================== !
! OUTPUT PARAMETERS
!=============================================================================== !
ProjectName         = Toroid_3D_g4       ! Name of the output project
DebugVisu           = F                  ! Launch the Gmsh GUI to visualize the mesh (T/F)
DebugMesh           = T                  ! Export a debug mesh in VTK format for ParaView
OutputFormat        = HDF5               ! Final mesh output format required by HORSES3D
doMortars           = T                  ! Compute mortar elements for non-conforming interfaces
! nThreads          = 0                  ! Multi-threading (0 = all available cores)

!=============================================================================== !
! MESH INPUT PARAMETERS
!=============================================================================== !
FileName            = Toroid_3D_g4.msh   ! Input mesh file generated by our Python curving script
Mode                = 3                  ! Spatial dimension (3D)
MeshScale           = 0.001              ! Scale factor (e.g., converts mm from CAD to meters)
NGeo                = 4                  ! Target geometric polynomial order (G2)
MeshIsAlreadyCurved = T                  ! Skip internal curving (handled externally via Python API)

!=============================================================================== !
! BOUNDARY CONDITIONS (PIDs)
!=============================================================================== !
! --- WALL ---
BoundaryName        = skin               ! Physical Group name defined in Gmsh
BoundaryType        = (/2,1,0,0/)        ! Viscous adiabatic wall
