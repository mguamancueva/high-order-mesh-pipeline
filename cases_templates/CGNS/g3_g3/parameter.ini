!=============================================================================== !
! PyHOPE CONFIGURATION FILE - TEMPLATE
! Case: CGNS to PyHOPE (Order 3 -> Order 3, NASA Common Research Model)
!=============================================================================== !

!=============================================================================== !
! OUTPUT PARAMETERS
!=============================================================================== !
ProjectName         = CRM_g3_CGNS        ! Name of the output project
DebugVisu           = F                  ! Launch the Gmsh GUI to visualize the mesh (T/F)
DebugMesh           = F                  ! Export a debug mesh in VTK format for ParaView
OutputFormat        = HDF5               ! Final mesh output format required by HORSES3D
doMortars           = F                  ! Compute mortar elements for non-conforming interfaces
! nThreads          = 1                  ! Multi-threading (1 = single core computation)

!=============================================================================== !
! MESH INPUT PARAMETERS
!=============================================================================== !
FileName            = CRM_WingBody_h0_g3_coarse.cgns ! Exact name of the exported CGNS mesh
Mode                = 3                  ! Spatial dimension (3D for external meshes)
MeshScale           = 0.001              ! Scale factor (converts mm from CAD to meters)
NGeo                = 3                  ! Target geometric polynomial order (G3)
MeshIsAlreadyCurved = T                  ! Skip internal curving (handled externally)

!=============================================================================== !
! BOUNDARY CONDITIONS (PIDs)
!=============================================================================== !

! --- FARFIELD / DOMAIN BOUNDARIES ---
BoundaryName        = Inlet
BoundaryType        = (/2,0,0,0/)

BoundaryName        = Outlet
BoundaryType        = (/3,0,0,0/)

BoundaryName        = Lateral
BoundaryType        = (/4,0,0,0/)

BoundaryName        = Top
BoundaryType        = (/5,0,0,0/)

BoundaryName        = Bottom
BoundaryType        = (/6,0,0,0/)

! --- VISCOUS WALLS (AIRCRAFT SKIN) ---
BoundaryName        = Fuselage
BoundaryType        = (/7,1,0,0/)

BoundaryName        = Wing
BoundaryType        = (/8,1,0,0/)

! --- SYMMETRY ---
BoundaryName        = Symmetry
BoundaryType        = (/9,0,0,0/)        ! Symmetry plane (half-model simulation)
