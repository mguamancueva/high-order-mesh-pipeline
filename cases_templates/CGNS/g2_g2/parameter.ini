!=============================================================================== !
! PyHOPE CONFIGURATION FILE - TEMPLATE
! Case: CGNS to PyHOPE (Order 2 -> Order 2, External Aerodynamics)
!=============================================================================== !

!=============================================================================== !
! OUTPUT PARAMETERS
!=============================================================================== !
ProjectName         = Sphere_Hexa_g2     ! Name of the output project (without extension)
DebugVisu           = T                  ! Launch the Gmsh GUI to visualize the mesh (T/F)
DebugMesh           = T                  ! Export a debug mesh in VTK format for ParaView
OutputFormat        = HDF5               ! Final mesh output format required by HORSES3D
doMortars           = T                  ! Compute mortar elements for non-conforming interfaces
! nThreads          = 0                  ! Multi-threading (0 = all available cores)

!=============================================================================== !
! MESH INPUT PARAMETERS
!=============================================================================== !
FileName            = Sphere_Hexa_g2.cgns ! Exact name of the exported CGNS mesh
Mode                = 3                  ! Spatial dimension (3D for external meshes)
MeshScale           = 0.001              ! Scale factor (converts mm from CAD to meters)
NGeo                = 2                  ! Target geometric polynomial order (G2)
MeshIsAlreadyCurved = T                  ! Skip internal curving (handled externally)

!=============================================================================== !
! BOUNDARY CONDITIONS (PIDs)
!=============================================================================== !

! --- AIR INLET ---
BoundaryName        = Entrada            ! Inlet boundary
BoundaryType        = (/3,0,0,0/)        ! 3 = Inflow (Prescribed velocity)

! --- AIR OUTLET ---
BoundaryName        = Salida             ! Outlet boundary
BoundaryType        = (/4,0,0,0/)        ! 4 = Outflow (Prescribed pressure)

! --- FAR-FIELD / TUNNEL WALLS ---
BoundaryName        = Dominio_exterior   ! Outer bounding box/tunnel walls
BoundaryType        = (/5,0,0,0/)        ! 5 = Wall

! --- SPHERE SURFACE ---
BoundaryName        = Esfera             ! Skin of the sphere
BoundaryType        = (/5,1,0,0/)        ! 5 = Wall
