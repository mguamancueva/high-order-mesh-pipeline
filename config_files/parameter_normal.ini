!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName = ESFERA_HEXAS_normal    ! Name of output files
DebugVisu = T                        ! Launch the GMSH GUI to visualize the mesh

DebugvisuLevel = 1

NVisu = 8 

checkElemJacobians=T

!=============================================================================== !
! MESH
!=============================================================================== !
FileName = ESFERA_HEXAS_g1_v3p2.cgns 
Mode = 3                        ! 3D Mode for external mesh
MeshScale = 0.001            

BugFix_ANSA_CGNS = T

!=============================================================================== !
! CURVED
!=============================================================================== !
useCurveds = T  
curvingMethod = 1 
NormalsType = 1

jacobianTolerance = 1e-20

!=============================================================================== !
! BOUNDARY CONDITIONS
!=============================================================================== !

! --- AIR INLET ---
BoundaryName = Entrada                     ! Air inlet
BoundaryType = (/3,0,0,0/)                 ! 3 = Inflow (Inlet velocity)

! --- AIR OUTLET ---
BoundaryName = Salida                      ! Air outlet
BoundaryType = (/4,0,0,0/)                 ! 4 = Outflow (Outlet pressure)

! --- WIND TUNNEL WALLS ---
BoundaryName = Dominio_exterior            ! Four side walls of the domain/tunnel
BoundaryType = (/5,0,0,0/)                 ! 5 = Wall (No-slip condition)

! --- SPHERE SURFACE ---
BoundaryName = Esfera                      ! Sphere surface
BoundaryType = (/5,1,0,0/)                 ! 5 = Wall (No-slip condition)
