!=============================================================================== !
! OUTPUT
!=============================================================================== !
ProjectName         = ESFERA_HEXAS_g4    ! Name of output files
DebugVisu           = F                  ! Launch the GMSH GUI to visualize the mesh
DebugMesh           = T                  ! Output debug mesh in VTK format
OutputFormat        = HDF5               ! Mesh output format (HDF5 / VTK)
doMortars           = T
! nThreads          = 0                  

!=============================================================================== !
! MESH
!=============================================================================== !
FileName            = ESFERA_HEXAS_g4_topo.msh  ! Exact name of the mesh exported from Gmsh API
Mode                = 3                         ! 3D Mode for external meshes
MeshScale           = 0.001                
NGeo                = 4                          
MeshIsAlreadyCurved = T                 

!=============================================================================== !
! BOUNDARY CONDITIONS
!=============================================================================== !

! --- AIR INLET ---
BoundaryName = Entrada                    ! Inlet
BoundaryType = (/3,0,0,0/)                ! 3 = Inflow (Inlet velocity)

! --- AIR OUTLET ---
BoundaryName = Salida                     ! Outlet
BoundaryType = (/4,0,0,0/)                ! 4 = Outflow (Outlet pressure)

! --- TUNNEL WALLS ---
BoundaryName = Dominio_exterior           ! Four lateral walls of the bounding box
BoundaryType = (/5,0,0,0/)                ! 5 = Wall (No-slip condition)

! --- SPHERE SURFACE ---
BoundaryName = Esfera                     ! The skin of the sphere
BoundaryType = (/5,1,0,0/)                ! 5 = Wall (No-slip condition)
